services:
  Job.domain.JobRepository:
    # The marketplace app reuses the Auth-owned Postgres DataSource until the shared config move in F0-3.
    class: ../../../../../Contexts/Job/infrastructure/persistence/typeorm/TypeOrmJobRepository
    arguments: ['@Auth.infrastructure.DataSource']

  Job.application.CreateJob:
    class: ../../../../../Contexts/Job/application/Create/CreateJob
    arguments: ['@Job.domain.JobRepository']

  Job.application.ListOpenJobsByZoneAndCategory:
    class: ../../../../../Contexts/Job/application/ListOpen/ListOpenJobsByZoneAndCategory
    arguments: ['@Job.domain.JobRepository']

  Job.application.GetJobDetail:
    class: ../../../../../Contexts/Job/application/GetDetail/GetJobDetail
    arguments: ['@Job.domain.JobRepository']
