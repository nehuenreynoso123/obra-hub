services:
  Offer.domain.OfferRepository:
    # The marketplace app reuses the Auth-owned Postgres DataSource until the shared config move in F0-3.
    class: ../../../../../Contexts/Offer/infrastructure/persistence/typeorm/TypeOrmOfferRepository
    arguments: ['@Auth.infrastructure.DataSource']

  Offer.application.CreateOffer:
    class: ../../../../../Contexts/Offer/application/Create/CreateOffer
    arguments: ['@Shared.infrastructure.TransactionManager', '@Offer.domain.OfferRepository', '@Job.domain.JobRepository']

  Offer.application.WithdrawOffer:
    class: ../../../../../Contexts/Offer/application/Withdraw/WithdrawOffer
    arguments: ['@Shared.infrastructure.TransactionManager', '@Offer.domain.OfferRepository']
