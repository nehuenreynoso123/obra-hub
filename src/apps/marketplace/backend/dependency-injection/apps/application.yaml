services:
  Apps.marketplace.controllers.StatusGetController:
    class: ../../controllers/StatusGetController
    arguments: []

  Apps.marketplace.controllers.Auth.SignUpPostController:
    class: ../../controllers/Auth/SignUpPostController
    arguments: ['@Auth.application.SignUp']

  Apps.marketplace.controllers.Auth.SignInPostController:
    class: ../../controllers/Auth/SignInPostController
    arguments: ['@Auth.application.SignIn']

  Apps.marketplace.controllers.Auth.RefreshTokenPostController:
    class: ../../controllers/Auth/RefreshTokenPostController
    arguments: ['@Auth.application.RefreshToken']